<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maxim Menuboard</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/fonts.css?v=1">
<style>
:root { --ink:#160d0e; --bord:#52222a; --red:#9e2a26; --cream:#f3dfb6; --ivory:#f8f0e3; --mauve:#d4b3b2; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #0d0808; color: var(--ivory); font-family: "Jost", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 22px clamp(16px, 4vw, 48px); }
h1 { margin: 0; font: italic 400 clamp(28px, 4vw, 44px) "Bodoni Moda", serif; color: var(--cream); }
h1 small { display: block; font: 500 12px "Jost"; font-style: normal; letter-spacing: .3em; text-transform: uppercase; color: var(--mauve); margin-bottom: 6px; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; }
.ctl button, .ctl a { min-height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(243,223,182,.3); background: none; color: var(--ivory); font: 500 13px "Jost"; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; }
.ctl button[aria-pressed="true"] { background: var(--cream); color: #2a1316; border-color: var(--cream); }
/* Wand: rote Wand wie im Laden, vier Screens über der Bar */
.wall { margin: 0 clamp(16px, 4vw, 48px) 40px; padding: clamp(20px, 4vw, 60px) clamp(14px, 3vw, 50px) 0; border-radius: 26px; background: linear-gradient(180deg, #8f2622, #6e1c1a 70%, #2a1316); position: relative; overflow: hidden; }
.wall::after { content: ""; display: block; height: 70px; margin: 30px calc(-1 * clamp(14px, 3vw, 50px)) 0; background: linear-gradient(180deg, #5a1b1d, #2a1213); border-top: 6px solid #c79b6c; }
.screens { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(6px, 1vw, 14px); }
.tv { position: relative; aspect-ratio: 9 / 16; background: #000; border: clamp(4px, .6vw, 9px) solid #111; border-radius: 6px; box-shadow: 0 20px 40px rgba(0,0,0,.5); overflow: hidden; cursor: zoom-in; }
.tv iframe { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; border: 0; transform-origin: 0 0; pointer-events: none; }
.tv video { width: 100%; height: 100%; object-fit: cover; display: block; }
.tv span { position: absolute; left: 8px; bottom: 8px; font-size: 11px; letter-spacing: .2em; color: rgba(255,255,255,.55); }
.note { margin: 0 clamp(16px, 4vw, 48px) 40px; color: var(--mauve); font-size: 14px; line-height: 1.6; max-width: 900px; }
dialog { padding: 0; border: 0; background: transparent; }
dialog::backdrop { background: rgba(0,0,0,.9); }
dialog .big { height: 92vh; aspect-ratio: 9 / 16; position: relative; overflow: hidden; }
dialog iframe { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; border: 0; transform-origin: 0 0; }
@media (max-width: 700px) { .screens { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <h1><small>Maxim Café &amp; Bar · Potsdamer Platz</small>Menuboard</h1>
  <div class="ctl">
    <button type="button" data-mode="live" aria-pressed="true">Live (HTML)</button>
    <button type="button" data-mode="video" aria-pressed="false">Videos (MP4)</button>
    <a href="../index.html">Zur Website</a>
  </div>
</header>
<div class="wall"><div class="screens" id="screens"></div></div>
<p class="note">Vier Hochkant Bildschirme 2160 x 3840 (4K), je 24 s nahtlose Schleife. Preise kommen aus derselben Datei wie die Website. Live laufen alle Screens nach der Uhrzeit synchron. Klick auf einen Screen vergrößert ihn.</p>
<dialog id="dlg"><div class="big" id="big"></div></dialog>
<script>
(function () {
  var box = document.getElementById("screens"), mode = "live";
  function fit(el) { var f = el.querySelector("iframe"); if (f) f.style.transform = "scale(" + (el.clientWidth / 1080) + ")"; }
  function draw() {
    box.innerHTML = "";
    [1, 2, 3, 4].forEach(function (s) {
      var tv = document.createElement("div"); tv.className = "tv";
      tv.innerHTML = mode === "live" ? '<iframe src="screen.html?s=' + s + '" title="Screen ' + s + '" loading="lazy"></iframe>' :
        '<video src="video/Maxim_Menuboard_Screen' + s + '_1080x1920.mp4" muted loop playsinline autoplay></video>';
      tv.insertAdjacentHTML("beforeend", "<span>" + s + "</span>");
      tv.addEventListener("click", function () { open(s); });
      box.appendChild(tv); fit(tv);
    });
  }
  function open(s) {
    var big = document.getElementById("big"), d = document.getElementById("dlg");
    big.innerHTML = '<iframe src="screen.html?s=' + s + '" title="Screen ' + s + '"></iframe>';
    d.showModal(); big.firstChild.style.transform = "scale(" + (big.clientWidth / 1080) + ")";
  }
  document.getElementById("dlg").addEventListener("click", function () { this.close(); });
  document.querySelectorAll("[data-mode]").forEach(function (b) {
    b.addEventListener("click", function () { mode = b.dataset.mode; document.querySelectorAll("[data-mode]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); draw(); });
  });
  window.addEventListener("resize", function () { document.querySelectorAll(".tv").forEach(fit); });
  draw();
})();
</script>
</body>
</html>
